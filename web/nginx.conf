# LeJuSec 웹 콘솔 정적 서빙 설정.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: 알 수 없는 경로는 index.html 로 폴백(React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산 캐시
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

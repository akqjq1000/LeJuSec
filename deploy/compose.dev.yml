# 로컬 개발용 의존 서비스. 운영 배포 구성이 아니다.
#   docker compose -f deploy/compose.dev.yml up -d
services:
  postgres:
    image: pgvector/pgvector:pg16   # 자산 CMDB + pgvector(벡터 검색) 겸용
    environment:
      POSTGRES_USER: lejusec
      POSTGRES_PASSWORD: lejusec
      POSTGRES_DB: lejusec
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lejusec"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4   # 선택: 별도 벡터 DB가 필요할 때
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

volumes:
  pgdata:
  qdrantdata:

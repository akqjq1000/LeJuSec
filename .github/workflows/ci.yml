name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Agent (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for agent sources
        id: check
        run: |
          if [ -n "$(find agent -name '*.go' -print -quit 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No agent/ Go sources yet — skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Go
        if: steps.check.outputs.present == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: agent/go.mod

      - name: Lint
        if: steps.check.outputs.present == 'true'
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: agent

      - name: Vet / Test / Build
        if: steps.check.outputs.present == 'true'
        working-directory: agent
        run: |
          go vet ./...
          go test -race -coverprofile=coverage.out ./...
          go build ./...

  control-plane:
    name: Control Plane (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for control-plane sources
        id: check
        run: |
          if [ -f control-plane/pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No control-plane/ project yet — skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Python
        if: steps.check.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        if: steps.check.outputs.present == 'true'
        working-directory: control-plane
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint / Type / Test
        if: steps.check.outputs.present == 'true'
        working-directory: control-plane
        run: |
          ruff check .
          ruff format --check .
          mypy src tests
          pytest -q

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Markdown link check
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: .github/markdown-link-check.json

  web:
    name: Web (GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for web project
        id: check
        run: |
          if [ -f web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No web/ project yet — skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node
        if: steps.check.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install / Lint / Typecheck / Test / Build
        if: steps.check.outputs.present == 'true'
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: [dependencies, ci]

  - package-ecosystem: gomod
    directory: "/agent"
    schedule:
      interval: weekly
    labels: [dependencies, agent]
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: "/control-plane"
    schedule:
      interval: weekly
    labels: [dependencies, control-plane]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: "/deploy"
    schedule:
      interval: weekly
    labels: [dependencies, docker]

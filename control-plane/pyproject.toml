[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lejusec-control-plane"
version = "0.0.1"
description = "LeJuSec control plane — API, orchestrator, RAG"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "cryptography>=43",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "httpx>=0.27",
]
# 선택: LLM 조치 생성기(Claude). 미설치면 template 폴백.
llm = [
    "anthropic>=0.40",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lejusec"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "defusedxml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
